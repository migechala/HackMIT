global:
  scrape_interval: 5s
  evaluation_interval: 10s
rule_files:
  - /etc/prometheus/rules.yml
scrape_configs:
  - job_name: threshold
    static_configs:
      - targets: ["exporter:8000"]
# Grafana unified alerting can also query Prometheus directly;
# these rules make sustained-exceedance a first-class Prometheus alert.
