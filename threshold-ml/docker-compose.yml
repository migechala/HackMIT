services:
  exporter:
    build: .
    ports: ["8000:8000"]
    volumes: ["./artifacts:/app/artifacts", "./data:/app/data"]
    command: python scripts/metrics_exporter.py
  prometheus:
    image: prom/prometheus
    ports: ["9090:9090"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml", "./prometheus_rules.yml:/etc/prometheus/rules.yml:ro"]
  grafana:
    image: grafana/grafana
    ports: ["3000:3000"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=threshold
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/provisioning:/etc/grafana/provisioning
  rack-A1:
    build: .
    image: threshold-ml:gx10
    ports: ["5000:5000"]
    volumes:
      - ./data/rack-A1:/app/data/real
      - ./artifacts:/app/artifacts
      - ./data/secondary_ir.npz:/app/data/secondary_ir.npz:ro
    devices:
      - /dev/snd
    command: python scripts/ingest_raw_server.py --bind 0.0.0.0:5000 --out data/real --config configs/drift.yaml --checkpoint artifacts/checkpoints/drift2_h128/drift2_h128_best.pt
  rack-B2:
    extends: rack-A1
    ports: ["5001:5000"]
    volumes:
      - ./data/rack-B2:/app/data/real
      - ./artifacts:/app/artifacts
      - ./data/secondary_ir.npz:/app/data/secondary_ir.npz:ro
  # per-rack auto-retrain — runs alongside ingest, hot-reloads new model
  retrain-rack-A1:
    image: threshold-ml:gx10
    volumes:
      - ./data/rack-A1:/app/data/real
      - ./artifacts:/app/artifacts
    command: python scripts/auto_retrain_halfhour.py
