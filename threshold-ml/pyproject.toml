[project]
name = "threshold-ml"
version = "0.2.0"
description = "THRESHOLD - Active Noise Control ML system for data-center tonal noise"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "numpy>=1.23",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
